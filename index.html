<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal portfolio page for Iain Ferguson">
  <link rel="icon" href="/favicon.ico?" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.gstatic.com/">
  <link rel="stylesheet" href="css/main.css">
  <title>IainFerguson.org</title>
</head>
<body>

  <div class="navbar">
    <div class="container">
      <a href="#home" class="logo"><span>Iain</span>Ferguson</a>
      <img id="mobile-cta" class="mobile-menu" src="images/menu.svg" alt="Open Navigation" loading="lazy">
      <nav>
        <img id="mobile-exit" class="mobile-menu-exit" src="images/exit.svg" alt="Close Navigation" loading="lazy">


        <ul class="primary-nav">
        <li><a href="#contactMe">Contact Me</a></li>
        </ul>
      </nav>
    </div>
  </div>

  <section class="hero" id="home">
    <div class="container">
      <div class="left-col">
        <h1>Hi, I'm<br>
        <span>Iain </span>Ferguson</h1>
        <p class="subhead">A Development Lead</p>
        <div class="hero-cta">
          <a href="#contactMe" class="primary-cta">Contact Me</a>
          </a>
        </div>
      </div>
    </div>
  </section>

    <section class="contact-section" id="contactMe">
      <div class="container">
        <div class="contact-left">
          <h1><span>Contact </span> Me</h1>
          <h2>Have a question or want to work with me? Please get in touch!</h2>
          <form action="POST" data-netlify="true">
            <label for="name">Name</label>
            <input type="text" name="name" id="name">
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
            <label for="message">Message</label>
            <textarea name="message" id="message" cols="30" rows="10"></textarea>

            <input type="submit" class="send-message-cta" value="Send Message">
          </form>
        </div>
      </div>
    </section>

    <section class="footer">
      <div class="container">
        <a href="https://www.linkedin.com/in/iainfergusonuk/" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg viewBox="0 0 128 128">
          <path fill="#0076b2" d="M116 3H12a8.91 8.91 0 00-9 8.8v104.42a8.91 8.91 0 009 8.78h104a8.93 8.93 0 009-8.81V11.77A8.93 8.93 0 00116 3z"></path><path fill="#fff" d="M21.06 48.73h18.11V107H21.06zm9.06-29a10.5 10.5 0 11-10.5 10.49 10.5 10.5 0 0110.5-10.49M50.53 48.73h17.36v8h.24c2.42-4.58 8.32-9.41 17.13-9.41C103.6 47.28 107 59.35 107 75v32H88.89V78.65c0-6.75-.12-15.44-9.41-15.44s-10.87 7.36-10.87 15V107H50.53z"></path>
          </svg>
        </a>
      </div>
    </section>

<script src="script.js"></script>
</body>
</html>
